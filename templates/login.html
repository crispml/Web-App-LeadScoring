<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Client Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            padding: 20px;
        }


        .login-container {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }


        h1 {

            margin-top: 0;

            text-align: center;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 18px;
        }


        input {

            width: 100%;

            padding: 12px;

            margin-top: 6px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 16px;
        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background: #222;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {

            background: #444;
        }


        .error {

            margin-top: 20px;

            padding: 12px;

            background: #f8eeee;

            color: #b42318;

            border-radius: 5px;

            text-align: center;
        }


        @media (max-width: 600px) {

            .login-container {

                padding: 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <h1>
        AI Lead Qualification
    </h1>


    <p class="subtitle">
        Client Login
    </p>


    <form method="post" action="/login">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
            autocomplete="username"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        >


        <button type="submit">
            Login
        </button>


    </form>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


</div>


</body>

</html>
